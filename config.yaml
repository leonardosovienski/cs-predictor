# cs-predictor — Fase 0 (esqueleto). O Elo inicial vem do ranking HLTV
# (data/teams_cs.json, semeado linearmente #1=1600 → #30=1300); K-factors por
# formato conforme o prompt de criação. Tudo recalibrável na Fase 1 (HLTV).
game: "CS2"
default_format: "bo3"
k_factor_base: 32          # BO1; BO3=40, BO5=48 (model.K_FACTORS)
bankroll: 1000
stake_unit: 50

teams_file: data/teams_cs.json
# ratings correntes persistidos por update_ratings (ausente → initial_elo)
ratings_file: data/ratings.json

database: data/cs.db

# Fase 1 — coleta HLTV (curl_cffi impersonate; sondagem 2026-07-11 OK)
hltv:
  scraper_delay: 2          # segundos entre páginas (cortesia)
  until_date: "2025-01-01"  # janela do backtest: ~18 meses

# Fase 1 — backtest prequential
backtest:
  burnin_days: 90           # ratings convergem da semente antes de medir
  min_team_matches: 10      # Brier só conta jogo onde ambos têm histórico
  default_seed_elo: 1400    # time fora do Top 30 semeado abaixo do #30
  bootstrap_iterations: 1000
  bootstrap_seed: 13
